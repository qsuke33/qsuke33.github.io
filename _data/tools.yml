# 計算ツールの一覧（トップページ・/tools/・各ツール下部の「ほかの計算ツール」で共通に使う）
# ツールを追加したら、ここに1件足すだけで全部に反映される。上から順に表示。
- url: /tools/tedori/
  icon: wallet
  name: 手取り計算シミュレーター
  summary: 年収（額面）から手取り・税金・社会保険料の内訳を計算
- url: /tools/fukugyo/
  icon: laptop
  name: 副業の税金シミュレーター
  summary: 副業で増える税金と、確定申告が必要か（20万円ルール）を判定
- url: /tools/nenshu-kabe/
  icon: wall
  name: 年収の壁 早見表・判定ツール
  summary: 178万・136万・130万円など、2026年の壁を超えるか判定
- url: /tools/furusato/
  icon: gift
  name: ふるさと納税 控除上限額シミュレーター
  summary: 自己負担2,000円で済む寄付額の上限の目安を計算
- url: /tools/ideco/
  icon: piggy
  name: iDeCo 節税シミュレーター
  summary: 掛金でいくら税金が安くなるか計算（2026年12月の上限引き上げ対応）
- url: /tools/fire/
  icon: fire
  name: FIRE 取り崩しシミュレーター
  summary: 資産は何歳までもつ？年齢ごとに取り崩し額を変えて試算
- url: /tools/iryohi/
  icon: cross
  name: 医療費控除シミュレーター
  summary: 医療費控除でいくら戻るか、セルフメディケーション税制と比較
- url: /tools/loan/
  icon: house
  name: 住宅ローン返済シミュレーター
  summary: 毎月の返済額・総返済額と、金利が上がった場合の比較
- url: /tools/taishokukin/
  icon: briefcase
  name: 退職金の税金・手取りシミュレーター
  summary: 退職所得控除を自動計算し、退職金の税金と手取りを計算
