# 計算ツールの一覧（トップページ・/tools/・各ツール下部の「ほかの計算ツール」で共通に使う）
# ツールを追加したら、ここに1件足すだけで全部に反映される。上から順に表示。
- url: /tools/tedori/
  name: 手取り計算シミュレーター
  summary: 年収（額面）から手取り・税金・社会保険料の内訳を計算
- url: /tools/fukugyo/
  name: 副業の税金シミュレーター
  summary: 副業で増える税金と、確定申告が必要か（20万円ルール）を判定
- url: /tools/nenshu-kabe/
  name: 年収の壁 早見表・判定ツール
  summary: 178万・136万・130万円など、2026年の壁を超えるか判定
- url: /tools/furusato/
  name: ふるさと納税 控除上限額シミュレーター
  summary: 自己負担2,000円で済む寄付額の上限の目安を計算
- url: /tools/ideco/
  name: iDeCo 節税シミュレーター
  summary: 掛金でいくら税金が安くなるか計算（2026年12月の上限引き上げ対応）
- url: /tools/iryohi/
  name: 医療費控除シミュレーター
  summary: 医療費控除でいくら戻るか、セルフメディケーション税制と比較
- url: /tools/loan/
  name: 住宅ローン返済シミュレーター
  summary: 毎月の返済額・総返済額と、金利が上がった場合の比較
