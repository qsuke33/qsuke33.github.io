# =============================================================
#  サイト全体の設定（変更したら push するだけで反映されます）
# =============================================================
title: "年収400万で4000万貯めた人のお金ツール"
tagline: "2026年の最新制度に対応した無料のお金の計算ツール"
description: "2026年の最新制度に対応した無料のお金の計算ツール（手取り・ふるさと納税・iDeCoなど）と、qsuke33が実際に購入した商品のレビュー"
author: qsuke33
url: "https://qsuke33.github.io"
baseurl: ""
lang: ja
timezone: Asia/Tokyo

# -------------------------------------------------------------
#  ★ アフィリエイトID（ここ1か所を書き換えるだけで全記事に反映）
#     空欄のままなら、ID なしの通常リンクになります。
# -------------------------------------------------------------
affiliate:
  amazon_tag: ""        # 例: "qsuke33-22"（AmazonアソシエイトのトラッキングID）
  rakuten_id: "59fc4ff5.1aef2b9a.59fc4ff6.d4443cc8"  # 例: "1a2b3c4d.5e6f7a8b.1a2b3c4d.5e6f7a8b"（楽天アフィリエイトID）

# Google Search Console の所有権確認（jekyll-seo-tag が <meta> を出力）
webmaster_verifications:
  google: "bAJYdXUFVpJAni5vPUiA54s0o5_2j1aMw9nI9ruLHZc"

# 楽天モバイルの紹介URL（my 楽天モバイル／Rakuten Link の「紹介する」で取得）。空なら公式キャンペーンページに飛ぶ
rakuten_mobile_referral_url: ""

# お問い合わせフォーム（Googleフォーム等）のURL。空欄なら「準備中」と表示。
contact_form_url: ""

# -------------------------------------------------------------
#  以下は通常変更不要
# -------------------------------------------------------------
permalink: /posts/:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default, image: /assets/images/ogp.png }

exclude:
  - inbox/
  - scripts/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .gitignore
