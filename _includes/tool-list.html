{%- comment -%} _data/tools.yml の一覧を表示。include.exclude に URL を渡すとそのツールを除く {%- endcomment -%}
<ul class="tool-list">
{%- for t in site.data.tools -%}
  {%- if t.url != include.exclude -%}
  <li><a href="{{ t.url | relative_url }}"><strong>{{ t.name }}</strong><span>{{ t.summary }}</span></a></li>
  {%- endif -%}
{%- endfor -%}
</ul>
